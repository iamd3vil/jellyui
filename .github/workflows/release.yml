name: Release

on:
  push:
    tags: ["v*"]
  # Builds snapshot archives (downloadable from the run) without publishing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # 22.04 keeps the glibc requirement at 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf nasm zlib1g-dev libasound2-dev libpulse-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
          python3 -m pip install --user meson ninja

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install meson nasm pkgconf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache static libmpv
        id: mpv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/mpv-static
          key: mpv-static-${{ matrix.target }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('scripts/build-mpv.sh') }}

      - name: Build static libmpv
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        run: scripts/build-mpv.sh

      - name: Build and package
        uses: iamd3vil/rlsr/.github/actions/rlsr@d8b58a5eb7344bcd0434098396724533895feccb # v0.11.0
        with:
          rlsr_version: v0.11.0
          args: --split --targets ${{ matrix.target }}${{ github.ref_type != 'tag' && ' --snapshot' || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Checksum and publish
        uses: iamd3vil/rlsr/.github/actions/rlsr@d8b58a5eb7344bcd0434098396724533895feccb # v0.11.0
        with:
          rlsr_version: v0.11.0
          publish: true
          args: --merge
          github_token: ${{ secrets.GITHUB_TOKEN }}
